[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-vision-nav"
version = "0.1.0"
description = "GNSS-denied vision navigation prototype for Raspberry Pi and PX4."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
runtime-metrics = [
  "psutil>=7,<8",
]
vio-evaluation = [
  "evo==1.37.1",
  "scipy>=1.11",
]
estimation = [
  "gtsam==4.2.2",
  "scipy>=1.11",
  "threadpoolctl>=3.6,<4",
  "numpy>=1.24,<2",
  "opencv-python-headless>=4.8,<4.12",
]
geo = [
  "geographiclib>=2.0",
  "pyproj>=3.4",
]
mavlink = [
  "pymavlink>=2.4",
]
neural-runtime = [
  "Pillow>=10",
  "onnxruntime>=1.18",
  "faiss-cpu>=1.8",
]
map-production = [
  "rasterio>=1.3",
  "pyproj>=3.4",
  "shapely>=2.0,<3",
]
research = [
  "torch>=2.4",
  "pytorch-lightning>=2.4",
  "mlflow>=2.16",
  "dvc[s3]>=3.55",
]
retrieval-export = [
  "torch>=2.4",
  "torchvision>=0.19",
  "safetensors>=0.4",
  "Pillow>=10",
  "onnx>=1.18",
  "onnxruntime>=1.18",
]
local-export = [
  "torch>=2.9",
  "kornia>=0.8.3",
  "onnx>=1.18",
  "onnxscript>=0.7",
  "onnxruntime>=1.18",
]

[project.scripts]
vision-nav-architecture-demo = "vision_nav.cli:main"
vision-nav-replay-estimator = "vision_nav.estimation.replay_smoother:main"
vision-nav-assess-pnp-uncertainty = "vision_nav.estimation.reprojection_uncertainty:main"
vision-nav-align-pnp-window = "vision_nav.estimation.pnp_window_alignment:main"
vision-nav-evaluate-bearinguav = "vision_nav.neural.bearinguav_reference:main"
vision-nav-benchmark-bearinguav = "vision_nav.neural.bearinguav_evaluation:main"
vision-nav-export-training-membership = "vision_nav.neural.bearinguav_evaluation:membership_main"
